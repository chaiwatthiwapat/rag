services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  ollama:
    image: ollama/ollama:0.12.3
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"

  app:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      FASTEMBED_CACHE_DIR: /model-cache
    volumes:
      - ./docs:/docs:ro
      - fastembed_cache:/model-cache
    depends_on:
      - qdrant
      - ollama
    profiles:
      - cli

volumes:
  qdrant_data:
  ollama_data:
  fastembed_cache:
